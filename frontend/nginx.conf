http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # Handle static assets - remove the /mobile/app prefix
        location ~ ^/mobile/app/static/(.*)$ {
            alias /usr/share/nginx/html/static/$1;
            expires 1y;
            add_header Cache-Control "public";
        }

        # Handle service worker
        location = /mobile/app/sw.js {
            alias /usr/share/nginx/html/sw.js;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/mobile/app";
        }

        # Handle manifest
        location = /mobile/app/manifest.json {
            alias /usr/share/nginx/html/manifest.json;
            add_header Cache-Control "no-cache";
        }

        # Handle React routes - must be last
        location /mobile/app {
            try_files $uri /index.html;
        }
    }

}

events {
    worker_connections 1024;
}